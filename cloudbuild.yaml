# Build the image and roll it onto the running Cloud Run service.
#
# This exists so the deploy can be set up entirely from the Cloud Build console
# — no terminal, no gcloud, no Cloud Shell. Point a trigger at this file
# (Console → Cloud Build → Triggers → Connect repository → Cloud Build
# configuration file → /cloudbuild.yaml) and every push to main ships itself.
#
# WHY THE DEPLOY STEP PASSES ONLY --image: `gcloud run deploy` with no other
# flags updates the container and leaves the rest of the service alone. The bot
# token, the webhook URL and secret, the Cloud Storage volume holding the
# owner/channel/logo state — all of that was set when the service was first
# created and must survive every deploy. Adding --set-env-vars here would
# REPLACE the environment rather than extend it, silently wiping the token.
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args: ['build', '-t', '$_IMAGE', '.']

  - name: gcr.io/cloud-builders/docker
    id: push
    args: ['push', '$_IMAGE']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE
      - --region=$_REGION
      - --quiet

images: ['$_IMAGE']

substitutions:
  _SERVICE: repost-bot
  _REGION: us-west1
  # cloud-run-source-deploy is the repository `gcloud run deploy --source`
  # already created in this project, so nothing new has to be provisioned.
  _IMAGE: us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/repost-bot:$SHORT_SHA

options:
  # Newer projects reject builds that stream logs to a bucket the build robot
  # cannot write. Cloud Logging is always available.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
